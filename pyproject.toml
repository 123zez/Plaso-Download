[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plaso-dl"
version = "0.1.0"
description = "Plaso live-class HLS downloader (learning project)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "platformdirs>=4.2",
  "rich>=13.7",
  "typer>=0.12",
  "websocket-client>=1.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
